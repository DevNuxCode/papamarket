{% extends 'base.html' %}
{% block content %}
<div class="clientes-lista">
  <h1>Clientes</h1>
  <a href="{% url 'clientes:crear' %}" class="btn primary">Nuevo cliente</a>
  <form method="get"><input type="search" name="q" placeholder="Buscar cliente..."></form>
  <div class="card">
  <table class="table">
<tr><th>ID</th><th>Nombre</th><th>Tienda</th><th>Crédito</th><th></th></tr>
{% for t in items %}
<tr>
  <td>{{ t.id }}</td><td>{{ t.nombre }}</td><td>{{ t.tienda }}</td>
  <td>
    {% if t.tiene_credito %}
      <button class="credit-info text-blue-600 hover:text-blue-800" 
              data-saldo="{{ t.saldo_credito }}"
              data-limite="{{ t.limite_credito }}"
              data-nombre="{{ t.nombre }}">
        Sí — saldo ${{ t.saldo_credito }}
      </button>
    {% else %}
      No
    {% endif %}
  </td>
  <td>
    <a class="btn" href="{% url 'clientes:editar' t.id %}">Editar</a>
    <a class="btn btn-danger delete-cliente" 
       href="{% url 'clientes:eliminar' t.id %}"
       data-cliente-id="{{ t.id }}"
       data-cliente-nombre="{{ t.nombre }}">Eliminar</a>
  </td>
</tr>
{% empty %}
<tr><td colspan="5">No hay clientes</td></tr>
{% endfor %}
</table>
</div>
</div>
<script src="/static/js/clientes.js"></script>
{% endblock %}
